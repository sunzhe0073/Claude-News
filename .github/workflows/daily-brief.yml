name: Daily brief

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间 06:00（提前触发，抵消 GitHub 高峰期数小时的延迟，争取 09:00 前更新）
  workflow_dispatch:       # Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build brief
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m brief --out-dir .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
            exit 0
          fi
          git commit -m "Daily brief $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
